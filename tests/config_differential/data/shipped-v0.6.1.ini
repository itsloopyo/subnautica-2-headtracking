; Subnautica 2 Head Tracking - configuration

[Network]
Port = 4242

[Tracking]
EnableOnStartup = true
YawSensitivity = 1.0
PitchSensitivity = 1.0
RollSensitivity = 1.0
InvertYaw = false
InvertPitch = false
InvertRoll = false
; Smoothing applied when the tracker runs on this machine (loopback).
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
LocalSmoothing = 0.0
; Smoothing applied when the tracker is a remote device on the network.
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
RemoteSmoothing = 0.15
; true = the game's reticle follows your aim point while your head is turned.
; false = the reticle stays at screen centre (vanilla behaviour).
ShowReticle = true
; Yaw mode: true = horizon-locked yaw (default), false = camera-local
WorldSpaceYaw = true

[Tooltip]
; Drag the interaction prompt ("hover an interactable") to the body-forward
; reticle so it sits where you are aiming, not at the head-tracked view centre.
; Per-frame gated on WBP_HoverTargetInfo's TextBlock_ObectName visibility:
; world-hover context follows the reticle; equipped-item action prompts
; (air bladder Inhale/Ascend etc) stay fixed because their child text block
; is collapsed.
FollowReticle = true
; Backbuffer pixels -> UMG slate units for the prompt's render transform. 1.0
; matches the reticle 1:1 on SN2 (one slate unit per backbuffer pixel for the
; world-hint widget). Adjust only if the prompt over- or undershoots the
; reticle at your resolution; lower = slower, higher = faster.
FollowScale = 1.0

[Position]
Enabled = true
SensitivityX = 1.0
SensitivityY = 1.0
SensitivityZ = 1.0
InvertX = false
InvertY = false
InvertZ = false
LimitX = 0.30
LimitY = 0.20
; Asymmetric on purpose: leaning in gets the generous 0.40, leaning back the
; restricted 0.10 so the camera cannot pull through the player model.
LimitZ = 0.40
LimitZBack = 0.10

[Hotkeys]
; Toggle tracking (End) and cycle tracking mode (Page Up) are fixed, each also
; reachable with a Ctrl+Shift chord. Only the yaw-mode toggle is rebindable
; here. VK code: PageDown = 0x22.
ToggleYawMode = 0x22
